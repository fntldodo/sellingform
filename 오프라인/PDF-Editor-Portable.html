<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Portable Editor - SellingForm Offline</title>
    <style>
        /* [BUILD_CSS_MARKER] */
    </style>
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Glass Header -->
            <header class="dashboard-header">
                <div class="header-left">
                    <div class="logo-box">PDF</div>
                    <h1 style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-left: 12px;">PDF 포터블
                        에디터</h1>
                    <div class="security-badge">
                        <span class="shield-icon">🛡️</span>
                        <span class="badge-text">100% 오프라인 모드 (인트라넷용)</span>
                    </div>
                </div>
                <div class="header-right">
                    <button id="btnExportImage" class="btn-premium"
                        style="background:white; border:1px solid #E2E8F0; margin-right:12px; padding:10px 20px; border-radius:12px; font-weight:700;">이미지
                        추출</button>
                    <button id="btnDownload" class="btn-premium"
                        style="background:var(--primary-indigo); color:white; border:none; padding:10px 20px; border-radius:12px; font-weight:700;">PDF
                        내보내기</button>
                </div>
            </header>

            <div class="pdf-container">
                <aside class="thumbnail-panel">
                    <div class="panel-header">
                        <div
                            style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;">
                            <h3 style="margin: 0; font-size: 13px; font-weight: 800; color: var(--text-main);">페이지</h3>
                            <div class="sidebar-btn-group"
                                style="display: flex; gap: 2px; background: #E1E8F2; padding: 3px; border-radius: 10px;">
                                <button id="btnMoveUp" class="sb-tool-btn">위</button>
                                <button id="btnMoveDown" class="sb-tool-btn">아래</button>
                                <button id="btnAddPdf" class="sb-tool-btn"
                                    style="color: var(--primary-indigo); background: white;">추가</button>
                            </div>
                        </div>
                        <input type="file" id="appendPdfInput" accept=".pdf, .jpg, .jpeg, .png" style="display: none;">
                    </div>
                    <div id="thumbnailList" class="thumbnail-list">
                        <div class="empty-thumbnails">PDF를 드래그하세요</div>
                    </div>
                </aside>

                <section class="editor-panel">
                    <div class="toolbar">
                        <div class="tool-group">
                            <button class="tool-btn active" data-tool="select">선택</button>
                            <button class="tool-btn" data-tool="marker">마커</button>
                            <button class="tool-btn" data-tool="text">텍스트</button>
                            <button class="tool-btn" data-tool="numbering">번호</button>
                            <button class="tool-btn" data-tool="signature">서명</button>
                            <button id="btnRotatePage" class="tool-btn">90° 회전</button>
                            <div class="tool-divider"></div>
                            <button id="btnUndo" class="tool-btn">되돌리기</button>
                            <button id="btnClear" class="tool-btn btn-danger">전체 삭제</button>
                            <div class="tool-divider"></div>
                            <button id="btnHelp" class="tool-btn help-btn">?</button>
                        </div>
                        <div class="zoom-controls">
                            <button id="btnZoomOut" class="btn-tool-icon">−</button>
                            <span id="zoomVal"
                                style="font-size: 12px; font-weight: 800; min-width: 40px; text-align: center;">100%</span>
                            <button id="btnZoomIn" class="btn-tool-icon">+</button>
                        </div>
                    </div>

                    <div class="preview-viewport">
                        <div id="canvasContainer" class="canvas-container">
                            <div id="dropzone" class="dropzone">
                                <div class="drop-icon">📄</div>
                                <p>PDF 파일을 여기에 끌어다 놓으세요</p>
                                <input type="file" id="pdfInput" accept=".pdf"
                                    style="position: absolute; opacity: 0; width: 1px; height: 1px;">
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="helpModal">
        <div class="modal-content help-modal-content" style="max-width: 600px;">
            <h2>💡 오프라인 에디터 안내</h2>
            <p>이 파일은 인터넷 없이 작동하는 독립 실행형 버전입니다.</p>
            <button class="btn-premium"
                style="width:100%; margin-top:20px; background:var(--primary-indigo); color:white; padding:15px; border-radius:12px; border:none; cursor:pointer;"
                onclick="closeModal('helpModal')">확인</button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        /* [BUILD_LIB_PDFLIB_MARKER] */
    </script>
    <script>
        /* [BUILD_LIB_PDFJS_MARKER] */
    </script>
    <script>

    </script>
    <script>
        /* [BUILD_LOGIC_MARKER] */
    </script>
</body>

</html>
