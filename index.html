<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selling Form - Digital Templates Hub</title>
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css&quot;) />
    <style>
        /* ========================================
           The Hub 스타일 + Mobile Responsive
        ======================================== */
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FAFAFA;
            color: #1a1a1a;
            min-height: 100vh;
            overflow-x: hidden; /* 모바일 가로 스크롤 방지 */
        }

        /* 헤더 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #E8E8E8;
            padding: 0 40px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #000;
            text-decoration: none;
            letter-spacing: -0.5px;
            z-index: 101;
        }

        /* 데스크탑 네비게이션 */
        .nav-desktop {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-link {
            color: #666;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-link:hover, .nav-link.active { color: #000; }

        .btn-workbench {
            padding: 8px 20px;
            background: #000;
            color: #fff;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-workbench:hover { opacity: 0.8; }

        /* 언어 토글 */
        .lang-toggle {
            display: flex;
            gap: 4px;
            background: #F0F0F0;
            padding: 3px;
            border-radius: 8px;
        }
        .lang-btn {
            border: none;
            background: none;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            color: #888;
        }
        .lang-btn.active { background: #fff; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* 햄버거 버튼 (모바일용) */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 102;
            padding: 10px;
        }
        .bar { width: 24px; height: 2px; background: #000; transition: 0.3s; }

        /* 모바일 메뉴 오버레이 */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            height: 100vh;
            background: white;
            z-index: 100;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 100px 40px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .mobile-menu.active { right: 0; }
        
        /* 딤드 배경 */
        .dimmed {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .dimmed.active { opacity: 1; visibility: visible; }

        /* 히어로 섹션 */
        .hero {
            text-align: center;
            padding: 100px 20px 60px;
        }
        .hero-title {
            font-size: 64px;
            font-weight: 800;
            background: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }
        .hero-desc { font-size: 18px; color: #666; font-weight: 400; }

        /* 카드 그리드 */
        .cards-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 100px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .card {
            background: white;
            border: 1px solid #E5E7EB;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border-color: #000;
        }
        
        .icon-box {
            width: 64px; height: 64px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin: 0 auto 24px;
        }
        .icon-orange { background: #FFF7ED; color: #F97316; }
        .icon-blue { background: #EFF6FF; color: #3B82F6; }
        .icon-green { background: #ECFDF5; color: #10B981; }
        .icon-purple { background: #FAF5FF; color: #A855F7; }

        .card-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .card-text { font-size: 14px; color: #666; line-height: 1.5; }
        
        .badge {
            display: inline-block; margin-top: 16px;
            padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .badge-ready { background: #DCFCE7; color: #166534; }
        .badge-soon { background: #F3F4F6; color: #6B7280; }

        .card.disabled { opacity: 0.6; cursor: not-allowed; }
        .card.disabled:hover { transform: none; box-shadow: none; border-color: #E5E7EB; }

        /* 반응형 (모바일) */
        @media (max-width: 768px) {
            .header { padding: 0 20px; height: 60px; }
            .nav-desktop { display: none; }
            .hamburger { display: flex; }
            
            .hero-title { font-size: 40px; }
            .hero-desc { font-size: 16px; }
            
            .cards-container { grid-template-columns: 1fr; padding: 0 20px 60px; }
            .card { padding: 30px; }
        }
    </style>
</head>
<body>
    <div class="dimmed" onclick="toggleMenu()"></div>

    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">Selling Form</a>

            <!-- 데스크탑 메뉴 -->
            <nav class="nav-desktop">
                <a href="pages/template-gallery.html?type=detail" class="nav-link">상세페이지</a>
                <a href="pages/website-layouts.html" class="nav-link">웹사이트</a>
                <div class="lang-toggle">
                    <button class="lang-btn active" onclick="setLang('ko')">KO</button>
                    <button class="lang-btn" onclick="setLang('en')">EN</button>
                </div>
                <a href="pages/workbench.html" class="btn-workbench">💼 내 작업</a>
            </nav>

            <!-- 햄버거 버튼 -->
            <div class="hamburger" onclick="toggleMenu()">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </header>

    <!-- 모바일 메뉴 -->
    <nav class="mobile-menu" id="mobileMenu">
        <a href="pages/template-gallery.html?type=detail" class="nav-link" style="font-size: 20px;">상세페이지 폼</a>
        <a href="pages/website-layouts.html" class="nav-link" style="font-size: 20px;">웹사이트 폼</a>
        <a href="pages/workbench.html" class="nav-link" style="font-size: 20px;">💼 내 작업</a>
        <div style="margin-top: auto; display: flex; gap: 10px;">
            <button class="lang-btn active" style="font-size: 16px; padding: 8px 16px;" onclick="setLang('ko')">Korean</button>
            <button class="lang-btn" style="font-size: 16px; padding: 8px 16px;" onclick="setLang('en')">English</button>
        </div>
    </nav>

    <!-- 히어로 -->
    <section class="hero">
        <h1 class="hero-title">The Hub</h1>
        <p class="hero-desc" data-i18n="subtitle">Premium Digital Templates for Professionals</p>
    </section>

    <!-- 카드 -->
    <div class="cards-container">
        <!-- 상세페이지 -->
        <a href="pages/template-gallery.html?type=detail" class="card">
            <div class="icon-box icon-orange">D</div>
            <h3 class="card-title" data-i18n="card1">상세페이지 폼</h3>
            <p class="card-text" data-i18n="desc1">쇼핑몰 상품 상세페이지 제작</p>
            <span class="badge badge-ready">✓ 바로 시작</span>
        </a>

        <!-- 웹사이트 -->
        <a href="pages/website-layouts.html" class="card disabled">
            <div class="icon-box icon-blue">S</div>
            <h3 class="card-title" data-i18n="card2">웹사이트 레이아웃</h3>
            <p class="card-text" data-i18n="desc2">기업/마케팅 랜딩페이지 코드</p>
            <span class="badge badge-soon">곧 출시</span>
        </a>

        <!-- PDF -->
        <a href="#" class="card disabled">
            <div class="icon-box icon-green">P</div>
            <h3 class="card-title" data-i18n="card3">PDF 편집기</h3>
            <p class="card-text" data-i18n="desc3">병합, 분할, 페이지 추출</p>
            <span class="badge badge-soon">곧 출시</span>
        </a>

        <!-- 이미지 -->
        <a href="#" class="card disabled">
            <div class="icon-box icon-purple">I</div>
            <h3 class="card-title" data-i18n="card4">이미지 도구</h3>
            <p class="card-text" data-i18n="desc4">변환, 압축, 크기 조정</p>
            <span class="badge badge-soon">곧 출시</span>
        </a>
    </div>

    <script>
        // 메뉴 토글
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.querySelector('.dimmed').classList.toggle('active');
            
            // 햄버거 애니메이션 (간단히 X자로 변형 가능하나 여기선 생략)
        }

        // 다국어
        const i18n = {
            ko: {
                subtitle: '전문가를 위한 프리미엄 디지털 템플릿',
                card1: '상세페이지 폼', desc1: '쇼핑몰 상품 상세페이지 제작',
                card2: '웹사이트 레이아웃', desc2: '기업/마케팅 랜딩페이지 코드',
                card3: 'PDF 편집기', desc3: '병합, 분할, 페이지 추출',
                card4: '이미지 도구', desc4: '변환, 압축, 크기 조정'
            },
            en: {
                subtitle: 'Premium Digital Templates for Professionals',
                card1: 'Product Details', desc1: 'Create e-commerce detail pages',
                card2: 'Website Layouts', desc2: 'Corporate/Landing page codes',
                card3: 'PDF Editor', desc3: 'Merge, split, extract pages',
                card4: 'Image Tools', desc4: 'Convert, compress, resize'
            }
        };

        function setLang(lang) {
            localStorage.setItem('lang', lang);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            // 텍스트 변경
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if(i18n[lang][key]) el.textContent = i18n[lang][key];
            });
        }
    </script>
</body>
</html>
