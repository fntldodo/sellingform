<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selling Form - Digital Templates Hub</title>
    <style>
        /* ========================================
           The Hub 스타일 - 초심플 디자인
        ======================================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', sans-serif;
            background: #FAFAFA;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ========================================
           헤더
        ======================================== */
        
        .header {
            background: #FFFFFF;
            border-bottom: 1px solid #E8E8E8;
            padding: 20px 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-link {
            color: #666;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #000;
        }

        .nav-link.active {
            color: #000;
            font-weight: 600;
        }

        .login-btn {
            padding: 10px 24px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #333;
        }

        /* ========================================
           히어로 섹션
        ======================================== */
        
        .hero {
            text-align: center;
            padding: 120px 40px 80px;
        }

        .hero-title {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .hero-subtitle {
            font-size: 20px;
            color: #666;
            font-weight: 400;
        }

        /* ========================================
           카드 그리드 (2개)
        ======================================== */
        
        .cards-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #E8E8E8;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.03) 0%, rgba(118, 75, 162, 0.03) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border-color: #667eea;
        }

        .card-icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 36px;
            font-weight: 700;
        }

        .card-icon-orange {
            background: #FFE8D6;
            color: #FF6B35;
        }

        .card-icon-blue {
            background: #D6E8FF;
            color: #3B82F6;
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .card-description {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }

        /* ========================================
           반응형
        ======================================== */
        
        @media (max-width: 968px) {
            .header {
                padding: 16px 30px;
            }

            .nav {
                gap: 24px;
            }

            .hero-title {
                font-size: 48px;
            }

            .hero-subtitle {
                font-size: 18px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        @media (max-width: 640px) {
            .header {
                padding: 16px 20px;
            }

            .nav {
                display: none;
            }

            .hero {
                padding: 80px 20px 60px;
            }

            .hero-title {
                font-size: 36px;
            }

            .hero-subtitle {
                font-size: 16px;
            }

            .cards-container {
                padding: 0 20px 60px;
            }

            .card {
                padding: 40px 30px;
            }

            .card-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">Selling Form</a>
            <nav class="nav">
                <a href="index.html" class="nav-link active">HOME</a>
                <a href="pages/template-gallery.html?type=detail" class="nav-link">상세페이지 폼</a>
                <a href="pages/website-layouts.html" class="nav-link">사이트 폼</a>
                <a href="pages/workbench.html" class="login-btn">💼 내 작업</a>
            </nav>
        </div>
    </header>

    <!-- 히어로 섹션 -->
    <section class="hero">
        <h1 class="hero-title">The Hub</h1>
        <p class="hero-subtitle">Premium Digital Templates for Professionals</p>
    </section>

    <!-- 카드 그리드 -->
    <div class="cards-container">
        <div class="cards-grid">
            <!-- Product Details -->
            <a href="pages/template-gallery.html?type=detail" class="card">
                <div class="card-icon-wrapper card-icon-orange">D</div>
                <h2 class="card-title">Product Details</h2>
                <p class="card-description">High conversion landing pages</p>
            </a>

            <!-- Website Layouts -->
            <a href="pages/website-layouts.html" class="card">
                <div class="card-icon-wrapper card-icon-blue">S</div>
                <h2 class="card-title">Website Layouts</h2>
                <p class="card-description">Full corporate & portfolio sites</p>
            </a>
        </div>
    </div>

    <script>
        // 간단한 네비게이션 하이라이트
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPath || 
                    (currentPath.includes('index.html') && link.textContent === 'HOME')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
