<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>셀링폼 - 상품 상세페이지 제작 도구</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="logo">
                <h1>📦 SellingForm</h1>
                <p class="tagline">쇼핑몰 상세페이지를 쉽고 빠르게</p>
            </div>
        </header>

        <!-- 메인 카드 섹션 -->
        <main class="main-content">
            <section class="intro">
                <h2>무엇을 만들고 싶으신가요?</h2>
                <p>로그인 없이 바로 시작하세요. 모든 작업은 내 컴퓨터에 안전하게 저장됩니다.</p>
            </section>

            <div class="card-grid">
                <!-- Module A: 상세페이지 빌더 -->
                <div class="feature-card" onclick="location.href='pages/detail.html'">
                    <div class="card-icon">🎨</div>
                    <h3>상품 상세페이지</h3>
                    <p>스마트스토어, 쿠팡용 상세페이지를 템플릿으로 빠르게 제작</p>
                    <div class="card-badge">MVP 1</div>
                </div>

                <!-- Module B: PDF 편집기 (비활성) -->
                <div class="feature-card disabled">
                    <div class="card-icon">📄</div>
                    <h3>PDF 간편 편집</h3>
                    <p>PDF 페이지 정리, 텍스트 추가, 서명 삽입</p>
                    <div class="card-badge soon">준비중</div>
                </div>

                <!-- Module C: 폼 랜딩 빌더 (비활성) -->
                <div class="feature-card disabled">
                    <div class="card-icon">📝</div>
                    <h3>문의/신청 랜딩페이지</h3>
                    <p>구글폼 연결형 랜딩페이지 제작</p>
                    <div class="card-badge soon">준비중</div>
                </div>
            </div>

            <!-- Workbench 진입 버튼 -->
            <div class="workbench-section">
                <button class="btn-workbench" onclick="location.href='pages/workbench.html'">
                    <span class="icon">💼</span>
                    <span class="text">내 작업 보기 (Workbench)</span>
                </button>
            </div>
        </main>

        <!-- 푸터 -->
        <footer class="footer">
            <p>SellingForm v3.8 | 모든 데이터는 브라우저에 안전하게 저장됩니다</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
