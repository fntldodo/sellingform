<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Quick Editor - SellingForm v3.9</title>
    <!-- Premium Fonts -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/app.css?v=3.9.22">
    <link rel="stylesheet" href="../css/index.css?v=3.9.22"> <!-- Global Layout -->
    <link rel="stylesheet" href="../css/pdf.css?v=3.9.22">
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- 1. Unified Slim Nav (Shared) -->
        <nav class="slim-nav">
            <a href="../index.html" class="nav-item" data-i18n="home">홈</a>
            <div class="nav-item active" data-i18n="pdf">PDF</div>
            <a href="workbench.html" class="nav-item" data-i18n="files">파일</a>
            <div class="nav-item" data-i18n="pay">결제</div>
            <div class="nav-item" data-i18n="set">설정</div>
        </nav>

        <!-- 2. Main Content Area -->
        <main class="main-content">
            <!-- Premium Glass Header -->
            <header class="dashboard-header">
                <div class="header-left">
                    <a href="../index.html" class="btn-back"
                        style="text-decoration:none; color:var(--text-muted); font-weight:700; margin-right:20px;"
                        data-i18n="back">뒤로가기</a>
                    <div class="logo-box">PDF</div>
                    <h1 style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-left: 12px;"
                        data-i18n="pdfTitle">PDF 퀵 에디터</h1>
                    <div class="security-badge">
                        <span class="shield-icon">🛡️</span>
                        <span class="badge-text" data-i18n="secBadge">100% 로컬 보안 (서버 전송 없음)</span>
                    </div>
                </div>

                <div class="header-right">
                    <div class="language-dropdown" style="margin-right: 24px;">
                        <button class="globe-btn" id="globeBtn">🌐</button>
                        <div class="dropdown-menu" id="langMenu">
                            <button class="menu-item" onclick="window.SellingForm.I18n.setLanguage('ko')">한국어
                                (KO)</button>
                            <button class="menu-item" onclick="window.SellingForm.I18n.setLanguage('en')">English
                                (EN)</button>
                        </div>
                    </div>
                    <button id="btnExportImage" class="btn-premium"
                        style="background:white; border:1px solid #E2E8F0; margin-right:12px; padding:10px 20px; border-radius:12px; font-weight:700;"
                        data-i18n="exportImg">이미지 추출</button>
                    <button id="btnSave" class="btn-premium"
                        style="background:white; border:1px solid #E2E8F0; margin-right:12px; padding:10px 20px; border-radius:12px; font-weight:700;"
                        data-i18n="saveWork">작업 저장</button>
                    <button id="btnDownload" class="btn-premium"
                        style="background:var(--primary-indigo); color:white; border:none; padding:10px 20px; border-radius:12px; font-weight:700;"
                        data-i18n="exportPdf">PDF 내보내기</button>
                </div>
            </header>

            <div class="pdf-container">
                <!-- Sidebar: Thumbnails -->
                <aside class="thumbnail-panel">
                    <div class="panel-header">
                        <h3 data-i18n="pages">페이지</h3>
                        <button id="btnAddPdf" class="btn-tool-link"
                            style="color: var(--primary-indigo); font-weight: 800; font-size: 13px; cursor: pointer; border:none; background:none;"
                            data-i18n="append">추가</button>
                        <input type="file" id="appendPdfInput" accept=".pdf"
                            style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;">
                    </div>
                    <div id="thumbnailList" class="thumbnail-list">
                        <div class="empty-thumbnails" data-i18n="uploadHint">
                            PDF를 업로드하세요
                        </div>
                    </div>
                </aside>

                <!-- Editor Viewport -->
                <section class="editor-panel">
                    <!-- Professional Toolbar -->
                    <div class="toolbar">
                        <div class="tool-group">
                            <button class="tool-btn active" data-tool="select" data-i18n="select">선택</button>
                            <button class="tool-btn" data-tool="marker" data-i18n="marker">마커</button>
                            <button class="tool-btn" data-tool="text" data-i18n="addText">텍스트 추가</button>
                            <button class="tool-btn" data-tool="signature" data-i18n="signature">서명(사인)</button>
                            <button id="btnRotatePage" class="tool-btn" data-i18n="rotate">90° 회전</button>
                            <div class="tool-divider"></div>
                            <button id="btnUndo" class="tool-btn" data-i18n="undo">되돌리기</button>
                            <button id="btnClear" class="tool-btn btn-danger" data-i18n="clearAll">전체 삭제</button>
                        </div>

                        <!-- v3.9.25: Marker Options Bar -->
                        <div id="markerOptionsBar" class="text-options-bar" style="display: none;">
                            <select id="markerColor" class="option-select">
                                <option value="black" data-i18n="black">검정</option>
                                <option value="red" data-i18n="red">빨강</option>
                                <option value="yellow" data-i18n="yellow" selected>노랑</option>
                            </select>
                            <div class="opacity-control">
                                <span style="font-size:11px; font-weight:700; color:var(--text-muted);">투명도</span>
                                <input type="range" id="markerOpacity" min="10" max="100" value="50"
                                    class="option-slider">
                                <span id="markerOpacityVal"
                                    style="font-size:11px; font-weight:800; min-width:30px;">50%</span>
                            </div>
                        </div>

                        <!-- v3.9.25: Property Adjustment Bar (When select tool is active) -->
                        <div id="propertyOptionsBar" class="text-options-bar property-bar" style="display: none;">
                            <div class="prop-group">
                                <span data-i18n="size">크기</span>
                                <button class="prop-adj-btn" onclick="adjustSelectedSize(-0.1)">-</button>
                                <button class="prop-adj-btn" onclick="adjustSelectedSize(0.1)">+</button>
                            </div>
                            <div class="prop-group" id="propOpacityGroup">
                                <span data-i18n="opacity">투명도</span>
                                <input type="range" id="selectedOpacity" min="10" max="100" value="100"
                                    class="option-slider">
                            </div>
                        </div>

                        <!-- Dynamic Text Options Bar (Visible when text tool active) -->
                        <div id="textOptionsBar" class="text-options-bar" style="display: none;">
                            <select id="textFontFamily" class="option-select">
                                <option value="Pretendard, Inter, sans-serif">Pretendard (추천)</option>
                                <option value="'Noto Sans KR', sans-serif">Noto Sans KR</option>
                                <option value="Inter, sans-serif">Inter</option>
                                <option value="'Gowun Batang', serif">고운 바탕 (명조)</option>
                                <option value="'Nanum Gothic', sans-serif">나눔 고딕</option>
                            </select>
                            <select id="textFontSize" class="option-select">
                                <option value="12">12px</option>
                                <option value="14">14px</option>
                                <option value="16" selected>16px</option>
                                <option value="20">20px</option>
                                <option value="24">24px</option>
                                <option value="32">32px</option>
                                <option value="48">48px</option>
                                <option value="64">64px</option>
                            </select>
                            <input type="color" id="textColorPicker" value="#000000" class="option-color-picker">
                        </div>
                        <div class="zoom-controls">
                            <button id="btnZoomOut" class="zoom-btn">−</button>
                            <span id="zoomLevel">100%</span>
                            <button id="btnZoomIn" class="zoom-btn">+</button>
                        </div>
                    </div>

                    <!-- Canvas Container -->
                    <div class="preview-viewport">
                        <div id="canvasContainer" class="canvas-container">
                            <div id="dropzone" class="dropzone">
                                <div class="drop-icon">📄</div>
                                <p data-i18n="dropHint">PDF를 드래그하거나 클릭하여 업로드</p>
                                <input type="file" id="pdfInput" accept=".pdf"
                                    style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;">
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="saveCompleteModal">
        <div class="modal-content"
            style="background: white; padding: 40px; border-radius: 32px; text-align: center; max-width: 400px; width: 90%;">
            <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 12px;" data-i18n="successTitle">저장 완료!</h2>
            <p style="color: #64748B; line-height: 1.6; margin-bottom: 32px;" data-i18n="successDesc">작업 내용이 나의 워크벤치에
                안전하게 저장되었습니다.</p>

            <button class="btn-premium"
                style="width: 100%; background: var(--primary-indigo); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer;"
                onclick="closeModal('saveCompleteModal')" data-i18n="continue">계속 편집하기</button>
            <button class="btn-premium"
                style="width: 100%; margin-top: 12px; background: white; border: 1px solid #E2E8F0; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer;"
                onclick="location.href='workbench.html'" data-i18n="goWorkbench">워크벤치로 이동</button>
        </div>
    </div>

    <!-- Signature Modal -->
    <div class="modal-overlay" id="signatureModal">
        <div class="modal-content" style="max-width: 500px;">
            <h2 data-i18n="signatureTitle">여기에 서명하세요</h2>
            <div class="signature-pad-container">
                <canvas id="signaturePad" width="450" height="250"></canvas>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button class="btn-premium"
                    style="flex: 1; background: #F1F5F9; color: #1E293B; border: none; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer;"
                    onclick="clearSignaturePad()" data-i18n="clear">초기화</button>
                <button class="btn-premium"
                    style="flex: 2; background: var(--primary-indigo); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer;"
                    onclick="saveSignature()" data-i18n="saveSub">서명 완료</button>
            </div>
            <button class="btn-tool-link"
                style="margin-top: 16px; color: #64748B; border:none; background:none; cursor:pointer;"
                onclick="closeModal('signatureModal')" data-i18n="cancel">취소</button>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Project Scripts -->
    <script src="../js/db.js?v=3.9.22"></script>
    <script src="../js/app.js?v=3.9.22"></script>
    <script src="../js/pdf.js?v=3.9.22"></script>
    <script>

                saveWork: '작업 저장',

                pages: '페이지',
                append: '추가',
                uploadHint: 'PDF를 업로드하세요',
                select: '선택',
                maskBlack: '검정 마스크',
                maskRed: '빨강 마스크',
                addText: '텍스트 추가',
                rotate: '90° 회전',
                dropHint: 'PDF를 드래그하거나 클릭하여 업로드',
                successTitle: '저장 완료!',
                successDesc: '작업 내용이 나의 워크벤치에 안전하게 저장되었습니다.',
                continue: '계속 편집하기',
                goWorkbench: '워크벤치로 이동',
                pdf: 'PDF',

                clearAll: '전체 삭제',
                signature: '서명(사인)',
                signatureTitle: '여기에 서명하세요',
                clear: '초기화',
                saveSub: '서명 완료',
                cancel: '취소',
                marker: '마커',
                black: '검정',
                red: '빨강',
                yellow: '노랑',

                opacity: '투명도'
            },
            en: {
                pdfTitle: 'PDF QUICK EDITOR',
                exportImg: 'Export Images',
                saveWork: 'Save Progress',
                exportPdf: 'Export PDF',
                pages: 'PAGES',
                append: 'APPEND',

                select: 'SELECT',
                maskBlack: 'MASK BLACK',

                continue: 'CONTINUE EDITING',
                goWorkbench: 'GO TO WORKBENCH',
                pdf: 'PDF',
                undo: 'Undo',
                clearAll: 'Clear All',
                signature: 'Signature',
                signatureTitle: 'Sign Here',
                clear: 'Clear',
                saveSub: 'Done',

                black: 'Black',

                opacity: 'Opacity'
            }
        };
    </script>
</body>

</html>
