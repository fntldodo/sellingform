<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Quick Editor - SellingForm v3.9</title>
    <!-- Premium Fonts -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/app.css?v=3.9.1">
    <link rel="stylesheet" href="../css/index.css?v=3.9.1"> <!-- Global Layout -->
    <link rel="stylesheet" href="../css/pdf.css?v=3.9.1">
</head>

<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- 1. Unified Slim Nav (Shared) -->
        <nav class="slim-nav">
            <a href="../index.html" class="nav-item" data-i18n="home">홈</a>
            <div class="nav-item active" data-i18n="pdf">PDF</div>
            <a href="workbench.html" class="nav-item" data-i18n="files">파일</a>
            <div class="nav-item" data-i18n="pay">결제</div>
            <div class="nav-item" data-i18n="set">설정</div>
        </nav>

        <!-- 2. Main Content Area -->
        <main class="main-content">
            <!-- Premium Glass Header -->
            <header class="dashboard-header">
                <div class="header-left">
                    <a href="../index.html" class="btn-back"
                        style="text-decoration:none; color:var(--text-muted); font-weight:700; margin-right:20px;"
                        data-i18n="back">뒤로가기</a>
                    <div class="logo-box">PDF</div>
                    <h1 style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-left: 12px;"
                        data-i18n="pdfTitle">PDF 퀵 에디터</h1>
                </div>

                <div class="header-right">
                    <div class="language-dropdown" style="margin-right: 24px;">
                        <button class="globe-btn" id="globeBtn">🌐</button>
                        <div class="dropdown-menu" id="langMenu">
                            <button class="menu-item" onclick="window.SellingForm.I18n.setLanguage('ko')">한국어
                                (KO)</button>
                            <button class="menu-item" onclick="window.SellingForm.I18n.setLanguage('en')">English
                                (EN)</button>
                        </div>
                    </div>
                    <button id="btnExportImage" class="btn-premium"
                        style="background:white; border:1px solid #E2E8F0; margin-right:12px; padding:10px 20px; border-radius:12px; font-weight:700;"
                        data-i18n="exportImg">이미지 추출</button>
                    <button id="btnSave" class="btn-premium"
                        style="background:white; border:1px solid #E2E8F0; margin-right:12px; padding:10px 20px; border-radius:12px; font-weight:700;"
                        data-i18n="saveWork">작업 저장</button>
                    <button id="btnDownload" class="btn-premium"
                        style="background:var(--primary-indigo); color:white; border:none; padding:10px 20px; border-radius:12px; font-weight:700;"
                        data-i18n="exportPdf">PDF 내보내기</button>
                </div>
            </header>

            <div class="pdf-container" style="height: calc(100vh - 80px); display: flex; overflow: hidden;">
                <!-- Sidebar: Thumbnails -->
                <aside class="thumbnail-panel"
                    style="width: 200px; background: white; border-right: 1px solid #E2E8F0; display: flex; flex-direction: column;">
                    <div class="panel-header"
                        style="padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F1F5F9;">
                        <h3 style="font-size: 14px; font-weight: 800;" data-i18n="pages">페이지</h3>
                        <button id="btnAddPdf" class="btn-tool-link"
                            style="color: var(--primary-indigo); font-weight: 800; font-size: 13px; cursor: pointer; border:none; background:none;"
                            data-i18n="append">추가</button>
                        <input type="file" id="appendPdfInput" accept=".pdf"
                            style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;">
                    </div>
                    <div id="thumbnailList" class="thumbnail-list" style="flex: 1; overflow-y: auto; padding: 16px;">
                        <div class="empty-thumbnails"
                            style="text-align: center; color: #94A3B8; font-size: 13px; margin-top: 40px;"
                            data-i18n="uploadHint">
                            PDF를 업로드하세요
                        </div>
                    </div>
                </aside>

                <!-- Editor Viewport -->
                <section class="editor-panel"
                    style="flex: 1; display: flex; flex-direction: column; background: #F8FAFC;">
                    <!-- Professional Toolbar -->
                    <div class="toolbar"
                        style="height: 60px; background: white; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
                        <div class="tool-group" style="display: flex; gap: 8px;">
                            <button class="tool-btn active" data-tool="select" data-i18n="select">선택</button>
                            <button class="tool-btn" data-tool="mask-black" data-i18n="maskBlack">검정 마스크</button>
                            <button class="tool-btn" data-tool="mask-red" data-i18n="maskRed">빨강 마스크</button>
                            <button class="tool-btn" data-tool="text" data-i18n="addText">텍스트 추가</button>
                            <button id="btnRotatePage" class="tool-btn"
                                style="background:#F1F5F9; color:var(--primary-indigo); border:none;"
                                data-i18n="rotate">90° 회전</button>
                            <div style="width: 1px; height: 24px; background: #E2E8F0; margin: 0 4px;"></div>
                            <button id="btnUndo" class="tool-btn"
                                style="background:transparent; color:#64748B; border:none;"
                                data-i18n="undo">되돌리기</button>
                            <button id="btnClear" class="tool-btn"
                                style="background:transparent; color:#EF4444; border:none;" data-i18n="clearAll">전체
                                삭제</button>
                        </div>
                        <div class="zoom-controls" style="display: flex; align-items: center; gap: 12px;">
                            <button id="btnZoomOut" class="zoom-btn">−</button>
                            <span id="zoomLevel"
                                style="font-size: 13px; font-weight: 700; min-width: 48px; text-align: center;">100%</span>
                            <button id="btnZoomIn" class="zoom-btn">+</button>
                        </div>
                    </div>

                    <!-- Canvas Container -->
                    <div class="preview-viewport"
                        style="flex: 1; overflow: auto; padding: 40px; display: flex; justify-content: center;">
                        <div id="canvasContainer" class="canvas-container"
                            style="position: relative; box-shadow: var(--soft-shadow);">
                            <div id="dropzone" class="dropzone"
                                style="width: 600px; height: 400px; border: 2px dashed #CBD5E1; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; cursor: pointer;">
                                <div class="drop-icon" style="font-size: 40px; margin-bottom: 16px; opacity: 0.3;">📄
                                </div>
                                <p style="font-weight: 700; color: #64748B;" data-i18n="dropHint">PDF를 드래그하거나 클릭하여 업로드
                                </p>
                                <input type="file" id="pdfInput" accept=".pdf"
                                    style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;">
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="saveCompleteModal">
        <div class="modal-content"
            style="background: white; padding: 40px; border-radius: 32px; text-align: center; max-width: 400px; width: 90%;">
            <div style="font-size: 48px; margin-bottom: 20px;">✅</div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 12px;" data-i18n="successTitle">저장 완료!</h2>
            <p style="color: #64748B; line-height: 1.6; margin-bottom: 32px;" data-i18n="successDesc">작업 내용이 나의 워크벤치에
                안전하게 저장되었습니다.</p>

            <button class="btn-premium"
                style="width: 100%; background: var(--primary-indigo); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer;"
                onclick="closeModal('saveCompleteModal')" data-i18n="continue">계속 편집하기</button>
            <button class="btn-premium"
                style="width: 100%; margin-top: 12px; background: white; border: 1px solid #E2E8F0; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer;"
                onclick="location.href='workbench.html'" data-i18n="goWorkbench">워크벤치로 이동</button>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Project Scripts -->
    <script src="../js/db.js?v=3.9.1"></script>
    <script src="../js/app.js?v=3.9.1"></script>
    <script>
        window.i18n = {
            ko: {
                pdfTitle: 'PDF 퀵 에디터',
                exportImg: '이미지 추출',
                saveWork: '작업 저장',
                exportPdf: 'PDF 내보내기',
                pages: '페이지',
                append: '추가',
                uploadHint: 'PDF를 업로드하세요',
                select: '선택',
                maskBlack: '검정 마스크',
                maskRed: '빨강 마스크',
                addText: '텍스트 추가',
                rotate: '90° 회전',
                dropHint: 'PDF를 드래그하거나 클릭하여 업로드',
                successTitle: '저장 완료!',
                successDesc: '작업 내용이 나의 워크벤치에 안전하게 저장되었습니다.',
                continue: '계속 편집하기',
                goWorkbench: '워크벤치로 이동',
                pdf: 'PDF',
                undo: '되돌리기',
                clearAll: '전체 삭제'
            },
            en: {
                pdfTitle: 'PDF QUICK EDITOR',
                exportImg: 'Export Images',
                saveWork: 'Save Progress',
                exportPdf: 'Export PDF',
                pages: 'PAGES',
                append: 'APPEND',
                uploadHint: 'Upload PDF to start',
                select: 'SELECT',
                maskBlack: 'MASK BLACK',
                maskRed: 'MASK RED',
                addText: 'ADD TEXT',
                rotate: 'ROTATE 90°',
                dropHint: 'Drag or click to upload PDF',
                successTitle: 'Saved Successfully!',
                successDesc: 'Your work has been safely saved to your workbench.',
                continue: 'CONTINUE EDITING',
                goWorkbench: 'GO TO WORKBENCH',
                pdf: 'PDF',
                undo: 'Undo',
                clearAll: 'Clear All'
            }
        };
    </script>
    <script src="../js/pdf.js?v=3.9.14"></script>
</body>

</html>

</html>
