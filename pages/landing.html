<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜딩페이지 빌더 - SellingForm</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/landing.css">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <a href="../index.html" class="btn-back">← 홈으로</a>
            <h1 class="page-title">🌐 랜딩페이지 빌더</h1>
        </div>
        <div class="header-right">
            <button id="btnBack" class="btn-secondary" style="display:none;">← 템플릿 선택</button>
            <button id="btnDownload" class="btn-primary" style="display:none;">📥 ZIP 다운로드</button>
        </div>
    </header>

    <main class="landing-container">
        <!-- 갤러리 모드 -->
        <section id="galleryMode" class="gallery-mode">
            <div class="gallery-header">
                <h2>템플릿을 선택하세요</h2>
                <p>마음에 드는 템플릿을 선택하고 텍스트만 수정하면 완성!</p>
            </div>

            <div class="template-grid" id="templateGrid">
                <!-- 템플릿 카드들이 JS로 렌더링됨 -->
            </div>
        </section>

        <!-- 편집 모드 -->
        <section id="editMode" class="edit-mode" style="display:none;">
            <div class="edit-layout">
                <!-- 좌측: 편집 패널 -->
                <aside class="edit-panel">
                    <h3>📝 텍스트 편집</h3>
                    <p class="help-text">아래 필드를 수정하면 오른쪽 미리보기에 실시간 반영됩니다.</p>
                    <div id="editFields">
                        <!-- 편집 필드들이 JS로 렌더링됨 -->
                    </div>
                </aside>

                <!-- 우측: 미리보기 -->
                <div class="preview-panel">
                    <div class="preview-header">
                        <span>미리보기</span>
                        <div class="preview-controls">
                            <button class="preview-size active" data-size="desktop">🖥️</button>
                            <button class="preview-size" data-size="mobile">📱</button>
                        </div>
                    </div>
                    <iframe id="previewFrame" class="preview-frame"></iframe>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/db.js"></script>
    <script src="../js/app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../js/landing.js"></script>
</body>

</html>
