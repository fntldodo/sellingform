<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 변환 도우미 - SellingForm</title>
    <link rel="stylesheet" href="../css/app.css">
    <style>
        .convert-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .upload-area {
            border: 2px dashed #e2e8f0;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 24px;
        }

        .upload-area:hover {
            border-color: #3b82f6;
            background: #f8fafc;
        }

        .file-list {
            margin-bottom: 24px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .file-name {
            flex: 1;
            font-size: 14px;
        }

        .btn-remove {
            color: #ef4444;
            cursor: pointer;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <a href="../index.html" class="btn-back">← 홈으로</a>
            <h1 class="page-title">🔄 이미지 to PDF 변환</h1>
        </div>
    </header>

    <main class="convert-container">
        <div class="upload-area" id="uploadArea">
            <div style="font-size: 48px; margin-bottom: 16px;">🖼️</div>
            <h3>이미지 파일을 업로드하세요</h3>
            <p style="color: #64748b; font-size: 14px;">JPG, PNG 파일을 PDF로 변환합니다.</p>
            <input type="file" id="imageInput" multiple accept="image/*" style="display: none;">
        </div>

        <div id="fileList" class="file-list"></div>

        <div style="text-align: center;">
            <button id="btnConvert" class="btn-primary" style="width: 100%; padding: 12px;" disabled>
                PDF로 변환 및 다운로드
            </button>
        </div>
    </main>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const images = [];
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const fileList = document.getElementById('fileList');
        const btnConvert = document.getElementById('btnConvert');

        uploadArea.onclick = () => imageInput.click();

        imageInput.onchange = (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                images.push(file);
                renderFileList();
            });
            btnConvert.disabled = images.length === 0;
        };

        function renderFileList() {
            fileList.innerHTML = images.map((f, i) => `
                <div class="file-item">
                    <span class="file-name">${f.name}</span>
                    <span class="btn-remove" onclick="removeFile(${i})">×</span>
                </div>
            `).join('');
        }

        window.removeFile = (idx) => {
            images.splice(idx, 1);
            renderFileList();
            btnConvert.disabled = images.length === 0;
        };

        btnConvert.onclick = async () => {
            const pdfDoc = await PDFLib.PDFDocument.create();

            for (const file of images) {
                const imgBytes = await file.arrayBuffer();
                let img;
                if (file.type === 'image/jpeg') img = await pdfDoc.embedJpg(imgBytes);
                else img = await pdfDoc.embedPng(imgBytes);

                const page = pdfDoc.addPage();
                const { width, height } = page.getSize();

                // Scale image to fit page
                const dims = img.scaleToFit(width - 40, height - 40);
                page.drawImage(img, {
                    x: (width - dims.width) / 2,
                    y: (height - dims.height) / 2,
                    width: dims.width,
                    height: dims.height,
                });
            }

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'converted.pdf';
            a.click();
        };
    </script>
</body>

</html>
