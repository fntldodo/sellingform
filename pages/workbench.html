<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workbench - SellingForm</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/workbench.css">
</head>

<body>
    <div class="workbench-container">
        <!-- 상단 네비게이션 -->
        <nav class="top-nav" style="display:flex; justify-content:space-between; align-items:center;">
            <button class="btn-back" onclick="location.href='../index.html'"
                style="border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; background:white; font-weight:700;">
                BACK
            </button>
            <h1 class="page-title" style="margin:0; font-size:24px; font-weight:800; letter-spacing:-0.02em;">MY
                WORKBENCH</h1>
            <button class="btn-import" id="btnImport"
                style="background:var(--primary-indigo, #4F46E5); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:700;">
                IMPORT JSON
            </button>
        </nav>

        <!-- 필터 및 검색 -->
        <div class="toolbar">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">전체</button>
                <button class="filter-btn" data-filter="detail">상세페이지</button>
                <button class="filter-btn" data-filter="pdf">PDF</button>
                <button class="filter-btn" data-filter="convert">변환</button>
                <button class="filter-btn" data-filter="form">폼</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 검색...">
            </div>
        </div>

        <!-- 작업 목록 -->
        <main class="items-grid" id="itemsGrid">
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <h3>아직 저장된 작업이 없습니다</h3>
                <p>새 프로젝트를 시작해보세요!</p>
                <button class="btn-primary" onclick="location.href='detail.html'">
                    상세페이지 만들기
                </button>
            </div>
        </main>
    </div>

    <!-- Undo 토스트 -->
    <div class="toast" id="undoToast" style="display: none;">
        <span class="toast-message">삭제되었습니다</span>
        <button class="btn-undo" id="btnUndo">취소</button>
    </div>

    <script src="../js/db.js?v=3.9.1"></script>
    <script src="../js/app.js?v=3.9.1"></script>
    <script src="../js/workbench.js?v=3.9.1"></script>
</body>

</html>
