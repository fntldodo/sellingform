<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세페이지 편집 - SellingForm</title>
    <link rel="stylesheet" href="../css/detail.css">
    <style>
    /* ========================================
       기본 레이아웃
    ======================================== */
    
    .detail-container {
        display: flex;
        gap: 0;
        min-height: calc(100vh - 70px);
    }

    .editor-panel {
        width: 400px;
        min-width: 400px;
        background: #f8f9fa;
        border-right: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    .preview-panel {
        flex: 1;
        background: #ffffff;
        overflow-y: auto;
    }

    /* 섹션 네비게이션 - 고정 */
    .section-nav {
        background: white;
        border-bottom: 1px solid #e2e8f0;
        padding: 15px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .section-btn {
        padding: 8px 12px;
        border: 1px solid #e2e8f0;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
    }

    .section-btn:hover {
        background: #f7fafc;
        border-color: #667eea;
    }

    .section-btn.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
    }

    /* 슬롯 편집기 - 바로 아래 표시 */
    .slot-editor {
        padding: 20px;
        flex: 1;
        overflow-y: auto;
    }

    /* ========================================
       모바일 반응형
    ======================================== */
    
    .mobile-tab-bar {
        display: none;
        position: fixed;
        top: 70px;
        left: 0;
        right: 0;
        background: white;
        border-bottom: 1px solid #e2e8f0;
        z-index: 90;
        height: 50px;
    }

    .tab-button {
        flex: 1;
        border: none;
        background: transparent;
        padding: 15px;
        font-size: 14px;
        font-weight: 600;
        color: #718096;
        cursor: pointer;
        position: relative;
        transition: color 0.2s;
    }

    .tab-button.active {
        color: #667eea;
    }

    .tab-button.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: #667eea;
    }

    @media (max-width: 968px) {
        .mobile-tab-bar {
            display: flex !important;
        }

        .detail-container {
            margin-top: 120px;
            flex-direction: column;
        }

        .editor-panel,
        .preview-panel {
            display: none;
            width: 100% !important;
            max-width: 100% !important;
            min-width: 100% !important;
            border: none !important;
        }

        .editor-panel.active,
        .preview-panel.active {
            display: flex;
        }

        /* 섹션 네비게이션 - 모바일에서 맨 위 고정 */
        .section-nav {
            position: sticky;
            top: 0;
            padding: 10px;
        }

        /* 슬롯 편집기 - 바로 아래 */
        .slot-editor {
            padding: 15px;
            margin-top: 0;
        }

        .page-title {
            font-size: 14px;
        }

        .btn-save,
        .btn-export {
            padding: 8px 12px;
            font-size: 13px;
        }
    }

    /* ========================================
       Export 모달 스타일
    ======================================== */
    
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10000;
        align-items: center;
        justify-content: center;
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        background: white;
        border-radius: 16px;
        max-width: 600px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
        padding: 24px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .modal-header h3 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        color: #1a202c;
    }

    .modal-header button {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #666;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: background 0.2s;
    }

    .modal-header button:hover {
        background: #f7fafc;
    }

    .modal-body {
        padding: 24px;
    }

    .modal-footer {
        padding: 24px;
        border-top: 1px solid #e2e8f0;
        display: flex;
        gap: 12px;
    }

    .export-type-option {
        display: flex;
        align-items: flex-start;
        padding: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .export-type-option:hover {
        border-color: #667eea;
        background: #f7fafc;
    }

    .export-type-option input[type="radio"] {
        margin-right: 12px;
        margin-top: 2px;
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .export-type-option input[type="radio"]:checked {
        accent-color: #667eea;
    }

    .option-title {
        font-weight: 600;
        margin-bottom: 4px;
        color: #333;
    }

    .option-desc {
        font-size: 13px;
        color: #666;
        margin: 0;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
    }

    .form-hint {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
    }

    .btn {
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-cancel {
        flex: 1;
        background: #f7fafc;
        color: #333;
    }

    .btn-cancel:hover {
        background: #e2e8f0;
    }

    .btn-primary {
        flex: 2;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .btn-primary:hover {
        transform: scale(1.02);
    }

    /* 섹션 버튼 상태별 스타일 */
.section-btn {
    padding: 8px 12px;
    border: 2px solid #e2e8f0;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    position: relative;
}

/* 필수 항목 있는 섹션 (미작성) */
.section-btn.required {
    border-color: #fbbf24;
    background: #fffbeb;
}

.section-btn.required:hover {
    border-color: #f59e0b;
    background: #fef3c7;
}

/* 작성 완료된 섹션 */
.section-btn.completed {
    border-color: #10b981;
    background: #d1fae5;
    color: #065f46;
}

.section-btn.completed:hover {
    border-color: #059669;
    background: #a7f3d0;
}

/* 활성화된 버튼 */
.section-btn.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
}

/* 활성화된 버튼이 완료 상태일 때 */
.section-btn.active.completed {
    background: #10b981;
    border-color: #10b981;
}

/* 활성화된 버튼이 필수 상태일 때 */
.section-btn.active.required {
    background: #f59e0b;
    border-color: #f59e0b;
}

</style>

</head>
<body>
    <!-- 헤더 -->
    <header class="detail-header">
        <div class="header-left">
            <a href="../index.html" class="btn-back">← 홈으로</a>
            <h1 class="page-title">상세페이지 편집</h1>
        </div>
        <div class="header-right">
            <button id="btnSave" class="btn-save">💾 저장</button>
            <button id="btnExport" class="btn-export">📦 Export</button>
        </div>
    </header>

    <!-- 모바일 탭 바 -->
    <div class="mobile-tab-bar">
        <button class="tab-button active" onclick="switchMobileTab('editor')">
            ✏️ 편집
        </button>
        <button class="tab-button" onclick="switchMobileTab('preview')">
            👁️ 미리보기
        </button>
    </div>

    <!-- 메인 컨텐츠 -->
    <div class="detail-container">
        <!-- 왼쪽: 편집 영역 -->
        <aside class="editor-panel active">
            <!-- 섹션 네비게이션 -->
            <div class="section-nav">
                <!-- JS로 동적 생성됨 -->
            </div>

            <!-- 슬롯 편집기 -->
            <div class="slot-editor" id="slotEditor">
                <!-- JS로 동적 생성됨 -->
            </div>
        </aside>

        <!-- 오른쪽: 미리보기 -->
        <main class="preview-panel">
            <div class="preview-header">
                <h3>실시간 미리보기</h3>
                <p>Export 시 완성된 형태로 생성됩니다</p>
            </div>
            <div class="preview-canvas-container">
                <canvas id="previewCanvas" width="860" height="5000"></canvas>
            </div>
        </main>
    </div>

    <!-- AI 문구 생성 모달 -->
    <div class="modal" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✨ AI 문구 생성</h3>
                <button onclick="closeAiModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>제품명</label>
                    <input type="text" id="aiProductName" placeholder="예: 프리미엄 비타민C 세럼">
                </div>
                <div class="form-group">
                    <label>키워드 (3개 이상, 쉼표로 구분)</label>
                    <input type="text" id="aiKeywords" placeholder="예: 미백, 탄력, 보습">
                </div>
                <div class="form-group">
                    <label>톤 & 매너</label>
                    <select id="aiTone">
                        <option value="professional">전문적</option>
                        <option value="friendly">친근함</option>
                        <option value="luxurious">고급스러움</option>
                        <option value="urgent">긴급함</option>
                    </select>
                </div>
                <button id="btnGenerateAi" class="btn btn-primary" style="width: 100%;">
                    문구 생성하기
                </button>
                <div id="aiResults" style="margin-top: 20px; display: none;">
                    <!-- AI 결과 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Export 모달 -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Export 옵션</h3>
                <button onclick="closeExportModal()">✕</button>
            </div>
            
            <div class="modal-body">
                <div class="form-group">
                    <label>프로젝트 이름</label>
                    <input type="text" id="exportProjectName" placeholder="예: my-product-page">
                </div>
                
                <div class="form-group">
                    <label>Export 형식</label>
                    
                    <label class="export-type-option">
                        <input type="radio" name="exportType" value="image" checked 
                               onchange="toggleExportOptions(this.value)">
                        <div>
                            <div class="option-title">📦 이미지로 Export</div>
                            <p class="option-desc">PNG/JPG 이미지 파일로 슬라이스하여 다운로드</p>
                        </div>
                    </label>
                    
                    <label class="export-type-option">
                        <input type="radio" name="exportType" value="html" 
                               onchange="toggleExportOptions(this.value)">
                        <div>
                            <div class="option-title">🌐 HTML로 Export</div>
                            <p class="option-desc">실제 작동하는 웹페이지(HTML + CSS + 이미지)</p>
                        </div>
                    </label>
                    
                    <label class="export-type-option">
                        <input type="radio" name="exportType" value="both" 
                               onchange="toggleExportOptions(this.value)">
                        <div>
                            <div class="option-title">🎁 둘 다 Export</div>
                            <p class="option-desc">이미지와 HTML 모두 별도 ZIP으로 다운로드</p>
                        </div>
                    </label>
                </div>
                
                <div id="imageOptions">
                    <div class="form-group">
                        <label>이미지 형식</label>
                        <select id="exportFormat">
                            <option value="png">PNG (고품질, 투명 지원)</option>
                            <option value="jpg">JPG (작은 용량)</option>
                            <option value="webp">WEBP (최적화)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>슬라이스 높이 (px)</label>
                        <input type="number" id="exportSliceHeight" value="1200" min="500" max="3000" step="100">
                        <div class="form-hint">
                            💡 높이가 클수록 파일 개수가 줄어듭니다 (권장: 1200px)
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button onclick="closeExportModal()" class="btn btn-cancel">취소</button>
                <button onclick="handleExport()" class="btn btn-primary">🚀 Export 시작</button>
            </div>
        </div>
    </div>

    <!-- JS 파일들 -->
    <script src="../js/app.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/guards.js"></script>
    <script src="../js/export.js"></script>
    <script src="../js/detail.js"></script>

    <script>
        // ========================================
        // 모바일 탭 전환
        // ========================================
        
        function switchMobileTab(tab) {
            const editorPanel = document.querySelector('.editor-panel');
            const previewPanel = document.querySelector('.preview-panel');
            const tabButtons = document.querySelectorAll('.tab-button');
            
            // 탭 버튼 상태 변경
            tabButtons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 패널 전환
            if (tab === 'editor') {
                editorPanel.classList.add('active');
                previewPanel.classList.remove('active');
            } else {
                editorPanel.classList.remove('active');
                previewPanel.classList.add('active');
            }
        }

        // ========================================
        // Export 관련 함수들
        // ========================================
        
        function toggleExportOptions(exportType) {
            const imageOptions = document.getElementById('imageOptions');
            if (exportType === 'html') {
                imageOptions.style.display = 'none';
            } else {
                imageOptions.style.display = 'block';
            }
        }

        async function handleExport() {
            const exportType = document.querySelector('input[name="exportType"]:checked').value;
            const projectName = document.getElementById('exportProjectName').value || 'sellingform-project';
            
            const options = {
                projectName: projectName,
                sliceHeight: parseInt(document.getElementById('exportSliceHeight').value) || 1200,
                format: document.getElementById('exportFormat').value || 'png'
            };
            
            closeExportModal();
            
            if (window.SellingForm && window.SellingForm.Utils) {
                window.SellingForm.Utils.showLoading('Export 중...');
            }
            
            try {
                const projectData = window.detailBuilderState?.projectData;
                
                if (!projectData) {
                    alert('프로젝트 데이터를 찾을 수 없습니다.');
                    if (window.SellingForm && window.SellingForm.Utils) {
                        window.SellingForm.Utils.hideLoading();
                    }
                    return;
                }
                
                const success = await window.SellingForm.Export.startExport(exportType, projectData, options);
                
                if (window.SellingForm && window.SellingForm.Utils) {
                    window.SellingForm.Utils.hideLoading();
                }
                
                if (success) {
                    if (window.SellingForm && window.SellingForm.Toast) {
                        window.SellingForm.Toast.show('Export 완료!', 2000);
                    } else {
                        alert('Export 완료!');
                    }
                }
            } catch (error) {
                console.error('Export 실패:', error);
                if (window.SellingForm && window.SellingForm.Utils) {
                    window.SellingForm.Utils.hideLoading();
                }
                alert('Export 중 오류가 발생했습니다: ' + error.message);
            }
        }

        function openExportModal() {
            document.getElementById('exportModal').classList.add('active');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        function closeAiModal() {
            document.getElementById('aiModal').classList.remove('active');
        }

        // Export 버튼 이벤트
        document.addEventListener('DOMContentLoaded', function() {
            const btnExport = document.getElementById('btnExport');
            if (btnExport) {
                btnExport.addEventListener('click', openExportModal);
            }
        });

        // 모달 배경 클릭 닫기
        document.getElementById('exportModal').addEventListener('click', function(e) {
            if (e.target === this) closeExportModal();
        });

        document.getElementById('aiModal').addEventListener('click', function(e) {
            if (e.target === this) closeAiModal();
        });
    </script>
</body>
</html>
