<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상세페이지 허브 - SellingForm v3.9</title>
  <!-- Premium Fonts -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/app.css?v=3.9.1">
  <link rel="stylesheet" href="../css/index.css?v=3.9.1"> <!-- Global Layout -->
  <style>
    /* Gallery specific refinements over dashboard layout */
    .gallery-mode {
      padding: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .gallery-header h2 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
      color: #1E293B;
    }

    .gallery-header p {
      color: #64748B;
      font-size: 16px;
      font-weight: 500;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
      padding-bottom: 100px;
    }

    .template-card {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid #E2E8F0;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .template-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.12);
      border-color: var(--primary-indigo);
    }

    .template-thumbnail {
      width: 100%;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      position: relative;
    }

    .template-info {
      padding: 24px 28px;
    }

    .template-info h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #1E293B;
    }

    .template-info p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 24px;
      height: 44px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .template-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .template-tag {
      background: #F1F5F9;
      color: #475569;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Preview Mode Container */
    .preview-content {
      display: flex;
      height: calc(100vh - 80px);
      overflow: hidden;
      background: #F8FAFC;
    }

    .preview-sidebar {
      width: 420px;
      background: white;
      border-right: 1px solid #E2E8F0;
      padding: 48px;
      display: flex;
      flex-direction: column;
    }

    .preview-sidebar h3 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 16px;
      letter-spacing: -0.04em;
    }

    .preview-sidebar p {
      color: #64748B;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .section-list {
      list-style: none;
      padding: 0;
      margin-bottom: 40px;
    }

    .section-list li {
      padding: 12px 0;
      border-bottom: 1px solid #F1F5F9;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 14px;
      color: #475569;
    }

    .section-list li::before {
      content: "✓";
      color: var(--primary-indigo);
      font-weight: 900;
    }

    .preview-frame-container {
      flex: 1;
      padding: 40px;
      display: flex;
      justify-content: center;
      overflow: auto;
    }

    .mockup-frame {
      width: 375px;
      height: 812px;
      background: white;
      border: 12px solid #1E293B;
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    /* Edit Overlay */
    .edit-overlay {
      display: none;
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 1000;
    }

    #editIframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body class="dashboard-body">
  <div class="dashboard-layout">
    <!-- 1. Unified Slim Nav -->
    <nav class="slim-nav">
      <a href="../index.html" class="nav-item" data-i18n="home">홈</a>
      <div class="nav-item active" data-i18n="detail">상세</div>
      <a href="workbench.html" class="nav-item" data-i18n="files">파일</a>
      <div class="nav-item" data-i18n="pay">결제</div>
      <div class="nav-item" data-i18n="set">설정</div>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="main-content">
      <!-- Premium Glass Header -->
      <header class="dashboard-header">
        <div class="header-left">
          <a href="../index.html" class="btn-back"
            style="text-decoration:none; color:var(--text-muted); font-weight:700; margin-right:20px;"
            data-i18n="back">뒤로가기</a>
          <h1 style="font-size: 20px; font-weight: 900; letter-spacing: -0.02em;" data-i18n="detailTitle">상세페이지 하브</h1>
        </div>

        <div class="header-right">
          <div class="language-dropdown" style="margin-right: 24px;">
            <button class="globe-btn" id="globeBtn">🌐</button>
            <div class="dropdown-menu" id="langMenu">
              <button class="menu-item" onclick="window.SellingForm.I18n.setLanguage('ko')">한국어 (KO)</button>
              <button class="menu-item" onclick="window.SellingForm.I18n.setLanguage('en')">English (EN)</button>
            </div>
          </div>
          <button id="btnBackToLibrary" class="btn-premium"
            style="display:none; background:white; border:1px solid #E2E8F0; padding:10px 20px; border-radius:12px; font-weight:700;"
            onclick="showGallery()" data-i18n="library">전체 목록</button>
        </div>
      </header>

      <!-- Gallery Mode -->
      <div id="galleryContainer" class="gallery-mode">
        <div class="gallery-header">
          <h2 data-i18n="premiumTemplates">Premium Templates</h2>
          <p data-i18n="galleryDesc">고객의 구매를 부르는 최적의 상세페이지 템플릿을 선택하세요.</p>
        </div>
        <div id="templateGrid" class="template-grid">
          <!-- JS Rendering -->
        </div>
      </div>

      <!-- Preview Mode -->
      <div id="previewContainer" class="preview-content" style="display:none;">
        <aside class="preview-sidebar">
          <h3 id="previewName">템플릿 이름</h3>
          <p id="previewDesc">템플릿 설명</p>

          <h4
            style="font-size:12px; font-weight:900; color:#94A3B8; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:16px;"
            data-i18n="includedSections">포함된 섹션</h4>
          <ul id="sectionList" class="section-list">
            <!-- JS Rendering -->
          </ul>

          <div style="margin-top:auto;">
            <button class="btn-premium"
              style="width:100%; padding:20px; background:var(--primary-indigo); color:white; border:none; border-radius:18px; font-weight:800; font-size:16px; margin-bottom:12px; cursor:pointer;"
              onclick="startEditing()" data-i18n="buildYours">이 템플릿으로 제작하기</button>
            <button class="btn-premium"
              style="width:100%; padding:16px; background:white; border:1px solid #E2E8F0; border-radius:18px; font-weight:700; color:#64748B; cursor:pointer;"
              onclick="downloadSample()" data-i18n="getRaw">샘플 다운로드 (HTML)</button>
          </div>
        </aside>

        <div class="preview-frame-container">
          <div class="mockup-frame">
            <iframe id="previewIframe"></iframe>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Mode (Fullscreen Overlay) -->
  <div id="editMode" class="edit-overlay">
    <iframe id="editIframe"></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="../js/app.js?v=3.9.1"></script>
  <script>
    // Language Dictionary
    window.i18n = {
      ko: {
        detailTitle: '상세페이지 허브',
        premiumTemplates: '프리미엄 템플릿',
        galleryDesc: '매출을 높이는 고퀄리티 상세페이지 디자인을 선택하세요.',
        includedSections: '구성된 섹션',
        buildYours: '이 템플릿으로 제작하기',
        getRaw: '샘플 다운로드 (HTML)',
        back: '뒤로가기',
        library: '전체 목록',
        detail: '상세'
      },
      en: {
        detailTitle: 'Detail Page Hub',
        premiumTemplates: 'Premium Templates',
        galleryDesc: 'Select a high-conversion template to start building.',
        includedSections: 'Included Sections',
        buildYours: 'Build Yours Now',
        getRaw: 'Get Raw Assets (HTML)',
        back: 'Back',
        library: 'All Templates',
        detail: 'Detail'
      }
    };

    const TEMPLATES = [
      { id: 'cosmetic', name: '화장품 프리미엄', desc: '뷰티/스킨케어 제품에 최적화된 고급스럽고 깨끗한 디자인', icon: '💄', color: '#FFF1F2', tags: ['뷰티', '스킨케어', '프리미엄'], sections: ['히어로 배너', '제품 특징', '성분 정보', '사용 방법', '리뷰', '구매 정보'] },
      { id: 'electronics', name: '감성 테크/가전', desc: '가전/IT 제품을 위한 깔끔하고 신뢰감 있는 현대적인 디자인', icon: '📱', color: '#F8FAFC', tags: ['가전', 'IT', '테크'], sections: ['제품 이미지', '핵심 스펙', '기능 설명', '비교표', '구성품', 'FAQ'] },
      { id: 'food', name: '신선 식품/미식', desc: '식품/건강기능식품을 위한 신선하고 입맛을 돋우는 디자인', icon: '🍎', color: '#F0FDF4', tags: ['식품', '건강', '유기농'], sections: ['메인 비주얼', '제품 소개', '영양 정보', '원재료', '섭취 방법', '인증마크'] },
      { id: 'fashion', name: '트렌디 패션', desc: '의류/잡화를 위한 감각적이고 세련된 디자인', icon: '👗', color: '#FAFAFA', tags: ['패션', '의류', '액세서리'], sections: ['룩북 이미지', '제품 정보', '사이즈 가이드', '소재 정보', '스타일링 팁', '배송/교환'] },
      { id: 'furniture', name: '모던 홈/가구', desc: '홈퍼니싱 제품을 위한 따뜻하고 포근한 인테리어 디자인', icon: '🛋️', color: '#FEFBEB', tags: ['가구', '인테리어', '홈'], sections: ['공간 연출', '제품 상세', '사이즈/규격', '소재 정보', '조립 안내', '배송 정보'] },
      { id: 'supplement', name: '메디컬/영양제', desc: '영양제/건강식품을 위한 신뢰도 높은 전문적 디자인', icon: '💊', color: '#F0FDFA', tags: ['건강', '영양제', '웰니스'], sections: ['제품 소개', '핵심 성분', '효능/효과', '섭취 방법', '주의사항', '인증서'] }
    ];

    let selectedTemplate = null;

    function renderGallery() {
      const grid = document.getElementById('templateGrid');
      grid.innerHTML = TEMPLATES.map(t => `
                <div class="template-card" onclick="openPreview('${t.id}')">
                    <div class="template-thumbnail" style="background: ${t.color}">
                        <span>${t.icon}</span>
                    </div>
                    <div class="template-info">
                        <h3>${t.name}</h3>
                        <p>${t.desc}</p>
                        <div class="template-tags">
                            ${t.tags.map(tag => `<span class="template-tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
    }

    function openPreview(id) {
      selectedTemplate = TEMPLATES.find(t => t.id === id);
      document.getElementById('galleryContainer').style.display = 'none';
      document.getElementById('previewContainer').style.display = 'flex';
      document.getElementById('btnBackToLibrary').style.display = 'block';

      document.getElementById('previewName').textContent = selectedTemplate.name;
      document.getElementById('previewDesc').textContent = selectedTemplate.desc;
      document.getElementById('sectionList').innerHTML = selectedTemplate.sections.map(s => `<li>${s}</li>`).join('');
      document.getElementById('previewIframe').srcdoc = `<html><body style="background:${selectedTemplate.color}"><h1 style="text-align:center; margin-top:100px;">${selectedTemplate.icon}<br>${selectedTemplate.name}</h1></body></html>`;
    }

    function showGallery() {
      document.getElementById('galleryContainer').style.display = 'block';
      document.getElementById('previewContainer').style.display = 'none';
      document.getElementById('editMode').style.display = 'none';
      document.getElementById('btnBackToLibrary').style.display = 'none';
    }

    function startEditing() {
      document.getElementById('editMode').style.display = 'block';
      document.getElementById('editIframe').src = `detail-editor.html?template=${selectedTemplate.id}`;
    }

    function downloadSample() {
      alert('준비 중인 기능입니다.');
    }

    window.addEventListener('DOMContentLoaded', renderGallery);
  </script>
</body>

</html>

</html>
